<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ms Alex's Classroom Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cinzel:wght@600;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-ui: 'Quicksand', sans-serif;
    --bg: linear-gradient(180deg,#cdeffd,#fff6d6);
    --panel: #ffffffee;
    --text: #2c3e50;
    --accent: #ff8fab;
    --accent2: #4fc3a1;
    --btn: #ffd166;
    --btnText: #5b3a00;
    --title-font: 'Baloo 2', sans-serif;
    --radius: 24px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    padding: 16px 10px;
    transition: background .4s ease, color .4s ease;
    overflow-x: hidden;
  }

  body[data-theme="young"] {
    --bg: linear-gradient(180deg,#cdeffd,#fff6d6);
    --panel: #ffffffee;
    --text: #2c3e50;
    --accent: #ff8fab;
    --accent2: #4fc3a1;
    --btn: #ffd166;
    --btnText: #5b3a00;
    --title-font: 'Baloo 2', sans-serif;
    --radius: 24px;
  }
  body[data-theme="preteen"] {
    --bg: radial-gradient(circle at 50% 0%, #1e1133, #090412 80%);
    --panel: #190e2edd;
    --text: #efe6ff;
    --accent: #c9a4ff;
    --accent2: #ffb347;
    --btn: #5b3fa3;
    --btnText: #f4e8ff;
    --title-font: 'Cinzel', serif;
    --radius: 16px;
  }

  #app { max-width: 780px; margin: 0 auto; }
  h1 {
    font-family: var(--title-font);
    text-align: center;
    font-size: clamp(1.4rem, 4.5vw, 2.2rem);
    margin: 4px 0 2px;
  }
  .sub { text-align: center; opacity: .85; font-size: .85rem; margin-bottom: 12px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 10px 0; }
  .card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
    backdrop-filter: blur(8px);
    margin-bottom: 12px;
  }
  button {
    font-family: var(--font-ui);
    font-weight: 700;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 10px 18px;
    background: var(--btn);
    color: var(--btnText);
    font-size: .95rem;
    transition: transform .12s ease, filter .12s ease, background .3s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.94); }
  button.ghost { background: transparent; border: 2px solid var(--accent); color: var(--text); }
  button.selected { outline: 3px solid var(--accent2); font-weight: 800; transform: scale(1.02); }

  #themeRow button { min-width: 150px; }

  #timerDisplay {
    font-family: var(--title-font);
    text-align: center;
    font-size: clamp(2.6rem, 9vw, 3.8rem);
    margin: 2px 0;
    letter-spacing: 2px;
  }
  #timerLabel { text-align: center; opacity: .85; font-size: .88rem; min-height: 1.2em; }

  #scene {
    position: relative;
    width: 100%;
    height: 340px;
    border-radius: var(--radius);
    overflow: hidden;
    background: rgba(0,0,0,0.25);
    margin: 10px 0;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .scenePane { display: none !important; width: 100%; height: 100%; position: absolute; inset: 0; align-items: center; justify-content: center; }
  body[data-theme="young"] #paneYoung { display: flex !important; }
  body[data-theme="preteen"] #panePreteen { display: block !important; }

  /* YOUNG THEME */
  #sunWrap { position: relative; width: 210px; height: 210px; }
  #sunRays {
    position: absolute; inset: -25px; border-radius: 50%;
    background: conic-gradient(#ffd166 0 15deg, transparent 15deg 30deg);
    transform-origin: center; animation: spin 22s linear infinite; opacity: .75;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sunFace {
    position: absolute; inset: 0; border-radius: 50%; background: #ffcf56;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    transition: background .3s ease;
  }
  #sunFace svg { width: 80%; height: 80%; }
  #volWord { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 1rem; color: var(--text); }

  /* PRETEEN THEME */
  #shelf3D {
    position: absolute; top: 80px; left: 20px; right: 20px; height: 16px;
    background: #5c3a21; border-top: 3px solid #8b5a2b; border-bottom: 4px solid #3a2211;
    box-shadow: 0 8px 12px rgba(0,0,0,0.6); z-index: 2;
  }
  #booksContainer { position: absolute; top: 10px; left: 25px; right: 25px; height: 70px; z-index: 3; }
  .mcBook {
    position: absolute; bottom: 0; width: 30px; height: 65px; transform-origin: bottom center;
    transition: left 0.1s linear, transform 0.2s ease;
  }
  .mcBook .bookClosed { width: 100%; height: 100%; display: block; }
  .mcBook .bookOpen { width: 65px; height: 50px; display: none; position: absolute; bottom: -5px; left: -15px; }
  .mcBook.fallen .bookClosed { display: none; }
  .mcBook.fallen .bookOpen { display: block; }
  .mcBook.wobble { animation: bookWobble 0.2s ease-in-out infinite alternate; }
  @keyframes bookWobble { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }

  #dragonSceneContainer { position: absolute; bottom: 0; left: 0; right: 0; height: 240px; display: flex; justify-content: center; align-items: flex-end; }
  .zzzText {
    position: absolute; top: 40px; right: 140px; font-family: 'Cinzel', serif; font-weight: 800;
    font-size: 1.4rem; color: #c9a4ff; opacity: 0; animation: zzzFloat 3s infinite ease-in-out;
  }
  @keyframes zzzFloat {
    0% { opacity: 0; transform: translate(0,0) scale(0.7); }
    50% { opacity: 0.8; }
    100% { opacity: 0; transform: translate(-15px,-30px) scale(1.2); }
  }

  #alertMsg { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-family: 'Cinzel', serif; color: #ffb347; font-weight: 800; font-size: 1.1rem; opacity: 0; transition: opacity .3s; z-index: 5; }
  #alertMsg.show { opacity: 1; }

  #meterBar { width: 100%; height: 18px; border-radius: 999px; background: rgba(0,0,0,.3); overflow: hidden; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
  #meterFill { height: 100%; width: 0%; background: linear-gradient(90deg,#4fc3a1,#ffd166,#ff6b6b); transition: width .08s ease-out; }

  #starRow { position: absolute; top: 10px; left: 14px; font-size: 1.1rem; font-weight: 800; }
  .controlsRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-top: 8px; }
  small.hint { display: block; text-align: center; opacity: .9; margin-top: 6px; font-size: .85rem; font-weight: 600; }
  #errorBox { display: none; background: #ffdddd; color: #b71c1c; border: 2px solid #f44336; border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-size: .85rem; text-align: center; }
  footer { text-align: center; opacity: .6; font-size: .75rem; margin-top: 20px; }
</style>
</head>
<body data-theme="young">
<div id="app">
  <h1>🎧 Ms Alex's Classroom Corner</h1>
  <div class="sub">Sound &amp; time management for a peaceful classroom</div>

  <div class="card" id="themeRow">
    <div class="row" style="margin:0;">

  <div class="card">

    <div class="row" id="presetButtons">

      <button id="addTwo">+2m</button>

      <button id="stopBtn" class="ghost">Stop</button>
    </div>
  </div>

  <div class="card">
    <div id="scene">
      <!-- YOUNG THEME -->
      <div class="scenePane" id="paneYoung">
        <div id="starRow">⭐ 0</div>
        <div id="sunWrap">
          <div id="sunRays"></div>
          <div id="sunFace">
            <svg viewBox="0 0 100 100">
              <path d="M22 32 Q32 32 40 32" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <path d="M60 32 Q68 32 78 32" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <ellipse cx="31" cy="43" rx="5" ry="6" fill="#2c3e50"/>
              <ellipse cx="69" cy="43" rx="5" ry="6" fill="#2c3e50"/>
              <circle cx="22" cy="52" r="6" fill="#ff8fab" opacity="0.5"/>
              <circle cx="78" cy="52" r="6" fill="#ff8fab" opacity="0.5"/>

            </svg>
          </div>
        </div>
        <div id="volWord">Shhh... quiet and stars! 🌿</div>
      </div>

      <!-- PRETEEN THEME -->
      <div class="scenePane" id="panePreteen">
        <div id="alertMsg">SHHH! The dragons are waking up!!</div>
        <div id="shelf3D"></div>
        <div id="booksContainer"></div>
        <div class="zzzText" id="zzzAnim">Z z z . .</div>

        <div id="dragonSceneContainer">
          <svg width="320" height="220" viewBox="0 0 320 220">
            <defs>
              <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8b52a1"/>
                <stop offset="100%" stop-color="#512b7a"/>
              </linearGradient>
              <linearGradient id="yellowBellyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffe17d"/>
                <stop offset="100%" stop-color="#f4a261"/>
              </linearGradient>
              <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#52b788"/>
                <stop offset="100%" stop-color="#1b4332"/>
              </linearGradient>
            </defs>

            <ellipse cx="160" cy="195" rx="100" ry="22" fill="#785028"/>
            <ellipse cx="160" cy="192" rx="90" ry="18" fill="#a07855"/>

            <path d="M 100 190 C 80 130 110 90 145 90 C 180 90 220 120 210 190 Z" fill="url(#purpleGrad)"/>
            <path d="M 125 130 C 135 110 165 110 175 130 C 180 160 170 185 125 185 Z" fill="url(#yellowBellyGrad)"/>

            <path d="M 105 130 C 70 100 50 120 65 160 C 85 165 100 150 105 130 Z" fill="#4a226e" stroke="#33144c" stroke-width="2"/>
            <path d="M 195 130 C 230 100 250 120 235 160 C 215 165 200 150 195 130 Z" fill="#4a226e" stroke="#33144c" stroke-width="2"/>

            <path d="M 125 95 C 120 50 155 40 180 55 C 190 65 185 90 165 95 Z" fill="url(#purpleGrad)"/>
            <path d="M 135 52 Q 125 30 115 25 Q 130 35 138 48 Z" fill="#ffd166"/>
            <path d="M 148 47 Q 145 22 138 15 Q 148 28 152 44 Z" fill="#ffd166"/>

            <g id="momFaceGroup">
              <path id="momEyeClosed" d="M 145 62 Q 152 68 160 62" stroke="#ffd166" stroke-width="3" stroke-linecap="round" fill="none"/>
              <g id="momEyeMedium" style="display:none;">
                <circle cx="152" cy="60" r="5" fill="#ffd166"/>

                <path d="M 165 65 Q 185 68 180 82 Q 160 82 165 65 Z" fill="#4a0000" stroke="#2a103c" stroke-width="2"/>

              <path d="M 178 72 Q 210 60 250 55 Q 220 80 180 80 Z" fill="#ff4500"/>
              <path d="M 178 73 Q 205 65 235 62 Q 210 77 180 78 Z" fill="#ffae00"/>
              <path d="M 178 74 Q 195 68 215 67 Q 200 75 180 76 Z" fill="#ffffff"/>
            </g>

            <path d="M 120 140 Q 140 160 160 155" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round"/>

            <g id="babyDragonGroup" transform="translate(138, 135)">
              <ellipse cx="20" cy="20" rx="16" ry="12" fill="url(#greenGrad)"/>
              <circle cx="12" cy="12" r="9" fill="url(#greenGrad)"/>
              <path d="M 12 16 Q 18 22 24 18" fill="none" stroke="#ffd166" stroke-width="5"/>
              <path d="M 22 14 C 30 6 35 14 28 22 Z" fill="#1b4332"/>
              <polygon points="8,5 5,0 10,3" fill="#ffd166"/>

              <path id="babyEyeClosed" d="M 8 12 Q 12 15 15 12" stroke="#ffd166" stroke-width="2" stroke-linecap="round" fill="none"/>
              <g id="babyCryingFace" style="display:none;">
                <path d="M 7 10 Q 11 7 15 10" stroke="#ffd166" stroke-width="2" fill="none"/>
                <circle cx="10" cy="16" r="4" fill="#3a0000"/>
                <path d="M 5 12 C 3 15 3 18 5 18 C 7 18 7 15 5 12 Z" fill="#4cc9f0"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="controlsRow">
      <button id="micBtn" type="button">🎙️ Start Listening</button>
      <button id="testNoiseBtn" class="ghost" type="button">⚡ Test Sound &amp; Effects</button>
      <button id="resetSceneBtn" class="ghost" type="button">🔄 Reset</button>
    </div>
    
    <div id="meterBar"><div id="meterFill"></div></div>
    <small class="hint" id="micHint">Click "Start Listening" or select a timer.</small>
    <div id="errorBox"></div>
  </div>

  <footer>Ms Alex's classroom · Safe &amp; Private</footer>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const body = document.body;
  const themeYoungBtn = document.getElementById('themeYoung');
  const themePreteenBtn = document.getElementById('themePreteen');
  const resetBtn = document.getElementById('resetSceneBtn');
  const errorBox = document.getElementById('errorBox');

  let currentTheme = 'young';
  
  function switchTheme(theme) {
    currentTheme = theme;
    body.setAttribute('data-theme', theme);
    if(theme === 'young') {
      themeYoungBtn.classList.add('selected');
      themePreteenBtn.classList.remove('selected');
      resetBtn.textContent = '🔄 Reset Stars';
    } else {
      themePreteenBtn.classList.add('selected');
      themeYoungBtn.classList.remove('selected');
      resetBtn.textContent = '📚 Organize Books';
    }
  }

  themeYoungBtn.onclick = () => switchTheme('young');
  themePreteenBtn.onclick = () => switchTheme('preteen');

  // Audio Synthesizer Controls
  let synthCtx = null;
  function getAudioCtx() {
    if (!synthCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      synthCtx = new AudioCtx();
    }
    if (synthCtx.state === 'suspended') synthCtx.resume();
    return synthCtx;
  }

  let lastShh = 0, lastHuff = 0, lastRoar = 0;

  function playShh() {
    const now = Date.now();
    if(now - lastShh < 4000) return;
    lastShh = now;
    const ctx = getAudioCtx();
    const bufferSize = ctx.sampleRate * 1.5;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2200;
    filter.Q.value = 1.2;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.01, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.4);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }

  function playHuff() {
    const now = Date.now();
    if(now - lastHuff < 4000) return;
    lastHuff = now;
    const ctx = getAudioCtx();
    const bufferSize = ctx.sampleRate * 1.2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.01, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.2);
    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 1.1);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }

  function playRoarAndCry() {
    const now = Date.now();
    if(now - lastRoar < 7000) return;
    lastRoar = now;
    const ctx = getAudioCtx();

    const osc = ctx.createOscillator();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 1.8);

    lfo.frequency.value = 25;
    lfoGain.gain.value = 30;
    lfo.connect(osc.frequency);

    gain.gain.setValueAtTime(0.01, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2.0);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(); lfo.start();
    osc.stop(ctx.currentTime + 2.0); lfo.stop(ctx.currentTime + 2.0);
  }

  function playChime() {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 1.0);
  }

  // Preteen Books Setup
  const booksContainer = document.getElementById('booksContainer');
  const bookColors = [{cover:'#ee5253', spine:'#c8d6e5'}, {cover:'#0abde3', spine:'#ffffff'}, {cover:'#10ac84', spine:'#feca57'}, {cover:'#5f27cd', spine:'#ff9ff3'}, {cover:'#ff9f43', spine:'#ffffff'}, {cover:'#54a0ff', spine:'#feca57'}];
  let books = [];
  const TOTAL_BOOKS = 6;

  function buildBooks(){
    booksContainer.innerHTML = '';
    books = [];
    const startX = 25, gap = 42;
    for(let i=0; i<TOTAL_BOOKS; i++){
      const c = bookColors[i % bookColors.length];
      const b = document.createElement('div');
      b.className = 'mcBook';
      const baseLeft = startX + (i * gap);
      b.style.left = baseLeft + 'px';
      b.innerHTML = `
        <svg class="bookClosed" viewBox="0 0 30 65"><rect x="0" y="0" width="26" height="65" fill="${c.cover}" rx="2"/><rect x="26" y="0" width="4" height="65" fill="rgba(0,0,0,0.25)"/><rect x="3" y="2" width="20" height="4" fill="${c.spine}"/><rect x="3" y="59" width="20" height="4" fill="${c.spine}"/><rect x="8" y="25" width="10" height="14" fill="#feca57" rx="1"/></svg>
        <svg class="bookOpen" viewBox="0 0 65 50"><polygon points="32,10 5,15 5,45 32,40" fill="#ffffff"/><polygon points="32,10 60,15 60,45 32,40" fill="#f5f6fa"/><polygon points="32,7 2,13 2,47 32,42" fill="${c.cover}" opacity="0.8"/><polygon points="32,7 63,13 63,47 32,42" fill="${c.cover}" opacity="0.8"/></svg>
      `;
      booksContainer.appendChild(b);
      books.push({ el: b, baseLeft: baseLeft, currentShift: 0, fallen: false });
    }
  }
  buildBooks();

  const alertMsg = document.getElementById('alertMsg');
  const zzzAnim = document.getElementById('zzzAnim');
  const smokeFX = document.getElementById('smokeFX');
  const fireFX = document.getElementById('fireFX');
  const momEyeClosed = document.getElementById('momEyeClosed');
  const momEyeMedium = document.getElementById('momEyeMedium');
  const momEyeAngry = document.getElementById('momEyeAngry');
  const momMouthClosed = document.getElementById('momMouthClosed');
  const momMouthOpen = document.getElementById('momMouthOpen');
  const babyEyeClosed = document.getElementById('babyEyeClosed');
  const babyCryingFace = document.getElementById('babyCryingFace');

  resetBtn.onclick = () => {
    if(currentTheme === 'preteen'){
      buildBooks();
      alertMsg.classList.remove('show');
      smokeFX.style.display = 'none'; fireFX.style.display = 'none'; zzzAnim.style.display = 'block';
      momEyeClosed.style.display = 'block'; momEyeMedium.style.display = 'none'; momEyeAngry.style.display = 'none';
      momMouthClosed.style.display = 'block'; momMouthOpen.style.display = 'none';
      babyEyeClosed.style.display = 'block'; babyCryingFace.style.display = 'none';
    } else {
      document.getElementById('starRow').textContent = '⭐ 0';
    }
  };

  function updatePreteenScene(vol){
    if(vol < 35){
      alertMsg.classList.remove('show');
      zzzAnim.style.display = 'block'; smokeFX.style.display = 'none'; fireFX.style.display = 'none';
      momEyeClosed.style.display = 'block'; momEyeMedium.style.display = 'none'; momEyeAngry.style.display = 'none';
      momMouthClosed.style.display = 'block'; momMouthOpen.style.display = 'none';
      babyEyeClosed.style.display = 'block'; babyCryingFace.style.display = 'none';
      books.forEach(b => b.el.classList.remove('wobble'));
    } else if(vol < 60){
      alertMsg.classList.add('show'); alertMsg.textContent = "Shhh... Lower your voice!";
      zzzAnim.style.display = 'block'; smokeFX.style.display = 'none'; fireFX.style.display = 'none';
      momEyeClosed.style.display = 'block'; momEyeMedium.style.display = 'none'; momEyeAngry.style.display = 'none';
      momMouthClosed.style.display = 'block'; momMouthOpen.style.display = 'none';
      babyEyeClosed.style.display = 'block'; babyCryingFace.style.display = 'none';
      books.forEach(b => { if(!b.fallen) b.el.classList.add('wobble'); });
      playShh();
    } else if(vol < 85){
      alertMsg.classList.add('show'); alertMsg.textContent = "SHHH! The mother dragon is waking up!!";
      zzzAnim.style.display = 'none'; smokeFX.style.display = 'block'; fireFX.style.display = 'none';
      momEyeClosed.style.display = 'none'; momEyeMedium.style.display = 'block'; momEyeAngry.style.display = 'none';
      momMouthClosed.style.display = 'block'; momMouthOpen.style.display = 'none';
      babyEyeClosed.style.display = 'block'; babyCryingFace.style.display = 'none';
      playHuff();
    } else {
      alertMsg.classList.add('show'); alertMsg.textContent = "ROAR!! TOO MUCH NOISE!!";
      zzzAnim.style.display = 'none'; smokeFX.style.display = 'none'; fireFX.style.display = 'block';
      momEyeClosed.style.display = 'none'; momEyeMedium.style.display = 'none'; momEyeAngry.style.display = 'block';
      momMouthClosed.style.display = 'none'; momMouthOpen.style.display = 'block';
      babyEyeClosed.style.display = 'none'; babyCryingFace.style.display = 'block';
      playRoarAndCry();
    }

    if(vol >= 60){
      const rightEdgeMax = (booksContainer.offsetWidth || 300) - 35;
      books.forEach((b, i) => {
        if(b.fallen) return;
        b.el.classList.remove('wobble');
        b.currentShift += ((vol - 50) * 0.012) * (1 + i * 0.1);
        let currentPos = b.baseLeft + b.currentShift;
        if(currentPos >= rightEdgeMax - (TOTAL_BOOKS - i) * 10){
          b.fallen = true; b.el.classList.add('fallen');
          b.el.style.left = (rightEdgeMax + 10) + 'px';
          b.el.style.transform = `translateY(125px) rotate(${15 + i*10}deg)`;
        } else {
          b.el.style.left = currentPos + 'px';
          b.el.style.transform = `rotate(${b.currentShift * 0.3}deg)`;
        }
      });
    }
  }

  function updateYoungScene(vol){
    const sunFace = document.getElementById('sunFace');
    const volWord = document.getElementById('volWord');
    if(vol < 35){
      volWord.textContent = 'Shhh... quiet and stars! 🌿';
      sunFace.style.background = '#ffcf56';
    } else if(vol < 65){
      volWord.textContent = 'Voices are rising... 🙂';
      sunFace.style.background = '#ffe066';
      playShh();
    } else if(vol < 85){
      volWord.textContent = 'Too noisy! 😮';
      sunFace.style.background = '#ff9248';
    } else {
      volWord.textContent = 'Way too loud! 😲';
      sunFace.style.background = '#ff595e';
    }
  }

  // Microphone Logic
  const micBtn = document.getElementById('micBtn');
  const testNoiseBtn = document.getElementById('testNoiseBtn');
  const micHint = document.getElementById('micHint');
  const meterFill = document.getElementById('meterFill');
  let audioCtx = null, analyser = null, dataArray = null, rafId = null, micStream = null, listening = false, isTesting = false;

  async function startMic(){
    if(listening) return;
    errorBox.style.display = 'none';
    micHint.textContent = 'Requesting microphone permission...';
    
    stopMicTracks();

    try{
      // BROWSER PERMISSION PROMPT APPEARS HERE
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();
      if(audioCtx.state === 'suspended') await audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);

      listening = true;
      micBtn.textContent = '🔇 Stop Listening';
      micHint.textContent = 'Microphone is ACTIVE!';
      loop();
    } catch(err) {
      console.error(err);
      errorBox.innerHTML = '⚠️ <b>Microphone access required</b>: Please allow permission in your browser address bar.';
      errorBox.style.display = 'block';
      micHint.textContent = 'Microphone permission was not granted.';
    }
  }

  function stopMicTracks(){
    if (micStream) {
      micStream.getTracks().forEach(track => {
        track.stop();
        track.enabled = false;
      });
      micStream = null;
    }
    if (audioCtx && audioCtx.state !== 'closed') {
      audioCtx.close();
      audioCtx = null;
    }
  }

  function stopMic(){
    listening = false;
    if(rafId) cancelAnimationFrame(rafId);
    
    stopMicTracks();

    micBtn.textContent = '🎙️ Start Listening';
    micHint.textContent = 'Click "Start Listening" or select a timer.';
    meterFill.style.width = '0%';
  }

  micBtn.onclick = () => {
    if(listening) {
      stopMic();
    } else {
      startMic();
    }
  };

  // Timer Integration
  let timerInterval = null, remainingSeconds = 0, isPaused = false;
  const timerDisplay = document.getElementById('timerDisplay');
  const timerLabel = document.getElementById('timerLabel');
  const presetButtons = document.getElementById('presetButtons');
  const runControls = document.getElementById('runControls');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');

  function updateTimerDisplay(){
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;
    timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }

  function startTimer(minutes){
    clearInterval(timerInterval);
    remainingSeconds = minutes * 60;
    isPaused = false;
    pauseBtn.textContent = 'Pause';
    updateTimerDisplay();
    presetButtons.style.display = 'none';
    runControls.style.display = 'flex';
    timerLabel.textContent = 'Timer running... Audio monitoring active!';

    // Prompts for permission and starts the mic automatically
    startMic();

    timerInterval = setInterval(() => {
      if(!isPaused){
        remainingSeconds--;
        updateTimerDisplay();
        if(remainingSeconds <= 0){
          clearInterval(timerInterval);
          timerLabel.textContent = '🎉 Time is up!';
          playChime();
          presetButtons.style.display = 'flex';
          runControls.style.display = 'none';
          
          // Turns off the mic automatically when the time is up
          stopMic();
        }
      }
    }, 1000);
  }

  presetButtons.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => startTimer(parseInt(btn.getAttribute('data-min'))));
  });

  document.getElementById('addOne').onclick = () => { remainingSeconds += 60; updateTimerDisplay(); };
  document.getElementById('addTwo').onclick = () => { remainingSeconds += 120; updateTimerDisplay(); };
  pauseBtn.onclick = () => {
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
  };
  stopBtn.onclick = () => {
    clearInterval(timerInterval);
    remainingSeconds = 0;
    updateTimerDisplay();
    timerLabel.textContent = 'Select a time or click "Start Listening"';
    presetButtons.style.display = 'flex';
    runControls.style.display = 'none';

    stopMic();
  };

  testNoiseBtn.onclick = () => {
    if(isTesting) return;
    isTesting = true;
    testNoiseBtn.textContent = '⏳ Testing...';
    let step = 0;
    let testLevels = [20, 45, 75, 95, 0];
    let testInterval = setInterval(() => {
      let vol = testLevels[step];
      meterFill.style.width = vol + '%';
      updateYoungScene(vol);
      updatePreteenScene(vol);
      step++;
      if(step >= testLevels.length){
        clearInterval(testInterval);
        isTesting = false;
        testNoiseBtn.textContent = '⚡ Test Sound & Effects';
        meterFill.style.width = '0%';
        updateYoungScene(0);
        updatePreteenScene(0);
      }
    }, 1800);
  };

  function loop(){
    if(!listening || isTesting) return;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    let average = sum / dataArray.length;
    let vol = Math.min(100, Math.round((Math.max(0, average - 8) / 50) * 100));

    meterFill.style.width = vol + '%';
    if(currentTheme === 'young') updateYoungScene(vol);
    else updatePreteenScene(vol);

    rafId = requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
