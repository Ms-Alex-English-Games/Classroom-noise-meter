<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ms Alex's Classroom Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cinzel:wght@600;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-ui: 'Quicksand', sans-serif;
    --shelf: #8b5a2b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-ui);
    background:var(--bg);
    color:var(--text);
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    transition:background .5s ease,color .5s ease;
    overflow-x:hidden;
  }

  [data-theme="young"]{
    --bg: linear-gradient(180deg,#cdeffd,#fff6d6);
    --panel: #ffffffee;
    --text:#2c3e50;
    --accent:#ff8fab;
    --accent2:#4fc3a1;
    --btn:#ffd166;
    --btnText:#5b3a00;
    --title-font:'Baloo 2', sans-serif;
    --radius:24px;
  }
  [data-theme="preteen"]{
    --bg: radial-gradient(circle at 50% 0%, #1e1133, #090412 80%);
    --panel:#190e2edd;
    --text:#efe6ff;
    --accent:#c9a4ff;
    --accent2:#ffb347;
    --btn:#5b3fa3;
    --btnText:#f4e8ff;
    --title-font:'Cinzel', serif;
    --radius:16px;
  }

  #app{max-width:780px;margin:0 auto;padding:16px 14px 30px;}
  h1{
    font-family:var(--title-font);
    text-align:center;
    font-size:clamp(1.4rem,4.5vw,2.2rem);
    margin:4px 0 2px;
  }
  .sub{text-align:center;opacity:.8;font-size:.85rem;margin-bottom:12px;}

  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0;}
  .card{
    background:var(--panel);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    backdrop-filter: blur(8px);
    margin-bottom:12px;
  }
  button{
    font-family:var(--font-ui);
    font-weight:700;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:10px 18px;
    background:var(--btn);
    color:var(--btnText);
    font-size:.95rem;
    transition:transform .12s ease, filter .12s ease;
  }
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(.94);}
  button.ghost{background:transparent;border:2px solid var(--accent);color:var(--text);}
  button.selected{outline:3px solid var(--accent2); font-weight:800;}

  #themeRow button{min-width:140px;}

  #timerDisplay{
    font-family:var(--title-font);
    text-align:center;
    font-size:clamp(2.6rem,9vw,3.8rem);
    margin:2px 0;
    letter-spacing:2px;
  }
  #timerLabel{text-align:center;opacity:.85;font-size:.88rem;min-height:1.2em;}

  #scene{
    position:relative;
    width:100%;
    height:340px;
    border-radius:var(--radius);
    overflow:hidden;
    background:rgba(0,0,0,0.25);
    margin:10px 0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .scenePane{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
  .scenePane.active{display:flex !important;}

  /* --- YOUNG THEME --- */
  #sunWrap{position:relative;width:210px;height:210px;}
  #sunRays{
    position:absolute;inset:-25px;border-radius:50%;
    background:conic-gradient(#ffd166 0 15deg, transparent 15deg 30deg);
    transform-origin:center;animation:spin 22s linear infinite;opacity:.75;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #sunFace{
    position:absolute;inset:0;border-radius:50%;background:#ffcf56;
    box-shadow:inset 0 -10px 0 rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;
    transition:background .3s ease, transform .2s ease;
  }
  #sunFace.shake{animation:shake .15s ease-in-out infinite;}
  @keyframes shake{0%,100%{transform:translate(0,0);}25%{transform:translate(-3px,2px);}75%{transform:translate(3px,-2px);}}
  #sunFace svg{width:80%;height:80%;}
  #volWord{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-weight:800;font-size:1rem;color:var(--text);}
  
  .steam{position:absolute;top:-10px;width:12px;height:12px;background:rgba(255,255,255,0.7);border-radius:50%;opacity:0;}
  .steam.left{left:40px;} .steam.right{right:40px;}
  .steam.puff{animation:steamUp 0.8s ease-out infinite;}
  @keyframes steamUp{0%{opacity:0.8;transform:translateY(0) scale(0.8);}100%{opacity:0;transform:translateY(-30px) scale(1.8);}}

  /* --- PRETEEN THEME --- */
  #shelf3D{
    position:absolute;top:80px;left:20px;right:20px;height:16px;
    background:#5c3a21;
    border-top:3px solid #8b5a2b;
    border-bottom:4px solid #3a2211;
    box-shadow: 0 8px 12px rgba(0,0,0,0.6);
    z-index:2;
  }

  #booksContainer{position:absolute;top:10px;left:25px;right:25px;height:70px;z-index:3;}
  
  .mcBook{
    position:absolute;bottom:0;width:30px;height:65px;
    transform-origin: bottom center;
    transition: left 0.1s linear, transform 0.3s ease;
  }
  .mcBook .bookClosed{width:100%;height:100%;display:block;}
  .mcBook .bookOpen{width:65px;height:50px;display:none;position:absolute;bottom:-5px;left:-15px;}
  .mcBook.fallen .bookClosed{display:none;}
  .mcBook.fallen .bookOpen{display:block;}

  #dragonSceneContainer{position:absolute;bottom:0;left:0;right:0;height:240px;display:flex;justify-content:center;align-items:flex-end;}

  .zzzText{
    position:absolute;top:40px;right:140px;font-family:'Cinzel', serif;font-weight:800;
    font-size:1.4rem;color:#c9a4ff;opacity:0;animation:zzzFloat 3s infinite ease-in-out;
  }
  @keyframes zzzFloat{
    0%{opacity:0;transform:translate(0,0) scale(0.7);}
    50%{opacity:0.8;}
    100%{opacity:0;transform:translate(-15px,-30px) scale(1.2);}
  }

  #alertMsg{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:'Cinzel', serif;color:#ffb347;font-weight:800;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:5;}
  #alertMsg.show{opacity:1;}

  #meterBar{width:100%;height:18px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:10px;border:1px solid rgba(255,255,255,0.1);}
  #meterFill{height:100%;width:0%;background:linear-gradient(90deg,#4fc3a1,#ffd166,#ff6b6b);transition:width .08s ease-out;}

  #starRow{position:absolute;top:10px;left:14px;font-size:1.1rem;font-weight:800;}
  .controlsRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:8px;}
  small.hint{display:block;text-align:center;opacity:.9;margin-top:6px;font-size:.85rem;font-weight:600;}
  
  #errorBox{
    display:none;
    background:#ffdddd;
    color:#b71c1c;
    border:2px solid #f44336;
    border-radius:12px;
    padding:10px 14px;
    margin-top:10px;
    font-size:.85rem;
    text-align:center;
  }

  footer{text-align:center;opacity:.6;font-size:.75rem;margin-top:20px;}
</style>
</head>
<body data-theme="young">
<div id="app">
  <h1>🎧 Ms Alex's Classroom Corner</h1>
  <div class="sub">Sound &amp; time management for happy classrooms</div>

  <div class="card" id="themeRow">
    <div class="row" style="margin:0;">
      <button id="themeYoung" class="selected" type="button">🌤️ Little Learners</button>

  <div class="card">
    <div id="timerDisplay">00:00</div>
    <div id="timerLabel">Pick a timer to begin</div>
    <div class="row">
      <button data-min="1">1 min</button>

  <div class="card">
    <div id="scene">
      <!-- YOUNG THEME -->
      <div class="scenePane active" id="paneYoung">
        <div id="starRow">⭐ 0</div>
        <div id="sunWrap">
          <div id="sunRays"></div>
          <div class="steam left" id="steamL"></div>
          <div class="steam right" id="steamR"></div>
          <div id="sunFace">
            <svg id="sunSvg" viewBox="0 0 100 100">
              <path id="browL" d="M22 32 Q32 32 40 32" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <path id="browR" d="M60 32 Q68 32 78 32" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <ellipse id="eyeL" cx="31" cy="43" rx="5" ry="6" fill="#2c3e50"/>

              <circle id="cheekR" cx="78" cy="52" r="6" fill="#ff8fab" opacity="0.5"/>
              <path id="mouth" d="M32 64 Q50 74 68 64" stroke="#2c3e50" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>

      <!-- PRETEEN THEME -->
      <div class="scenePane" id="panePreteen">

        <div id="shelf3D"></div>
        <div id="booksContainer"></div>
        <div class="zzzText" id="zzzAnim">Z z z . .</div>

        <div id="dragonSceneContainer">
          <svg width="320" height="220" viewBox="0 0 320 220">
            <defs>
              <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8b52a1"/>

              </linearGradient>
              <linearGradient id="yellowBellyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffe17d"/>

              </linearGradient>
              <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">

            <!-- Nest -->
            <ellipse cx="160" cy="195" rx="100" ry="22" fill="#785028"/>

            <!-- Mother Dragon Body -->
            <path d="M 100 190 C 80 130 110 90 145 90 C 180 90 220 120 210 190 Z" fill="url(#purpleGrad)"/>

            <!-- Wings -->
            <path d="M 105 130 C 70 100 50 120 65 160 C 85 165 100 150 105 130 Z" fill="#4a226e" stroke="#33144c" stroke-width="2"/>

            <!-- Mother Head -->
            <path d="M 125 95 C 120 50 155 40 180 55 C 190 65 185 90 165 95 Z" fill="url(#purpleGrad)"/>

            <!-- Face Group -->
            <g id="momFaceGroup">
              <path id="momEyeClosed" d="M 145 62 Q 152 68 160 62" stroke="#ffd166" stroke-width="3" stroke-linecap="round" fill="none"/>
              <g id="momEyeMedium" style="display:none;">
                <circle cx="152" cy="60" r="5" fill="#ffd166"/>

              <path d="M 178 72 Q 210 60 250 55 Q 220 80 180 80 Z" fill="#ff4500"/>

              <path d="M 178 74 Q 195 68 215 67 Q 200 75 180 76 Z" fill="#ffffff"/>

            <path d="M 120 140 Q 140 160 160 155" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round"/>

            <!-- Baby Dragon -->
            <g id="babyDragonGroup" transform="translate(138, 135)">
              <ellipse cx="20" cy="20" rx="16" ry="12" fill="url(#greenGrad)"/>
              <circle cx="12" cy="12" r="9" fill="url(#greenGrad)"/>
              <path d="M 12 16 Q 18 22 24 18" fill="none" stroke="#ffd166" stroke-width="5"/>
              <path d="M 22 14 C 30 6 35 14 28 22 Z" fill="#1b4332"/>
              <polygon points="8,5 5,0 10,3" fill="#ffd166"/>

              <path id="babyEyeClosed" d="M 8 12 Q 12 15 15 12" stroke="#ffd166" stroke-width="2" stroke-linecap="round" fill="none"/>
              
              <g id="babyCryingFace" style="display:none;">
                <path d="M 7 10 Q 11 7 15 10" stroke="#ffd166" stroke-width="2" fill="none"/>
                <circle cx="10" cy="16" r="4" fill="#3a0000"/>

      </div>
    </div>

    <div class="controlsRow">
      <button id="micBtn" type="button">🎙️ Start Listening</button>
      <button id="testNoiseBtn" class="ghost" type="button">⚡ Δοκιμή (Test Graphics)</button>
      <button id="resetSceneBtn" class="ghost" type="button">🔄 Reset Scene</button>
    </div>
    
    <div id="meterBar"><div id="meterFill"></div></div>

    <div id="errorBox"></div>

  <footer>Made for Ms Alex's classroom · Private &amp; secure</footer>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const body = document.body;
  const themeYoungBtn = document.getElementById('themeYoung');
  const themePreteenBtn = document.getElementById('themePreteen');
  const paneYoung = document.getElementById('paneYoung');
  const panePreteen = document.getElementById('panePreteen');
  const resetBtn = document.getElementById('resetSceneBtn');
  const errorBox = document.getElementById('errorBox');

  let currentTheme='young';
  
  function setTheme(name){
    currentTheme=name;
    body.setAttribute('data-theme', name);
    if(name === 'young'){
      themeYoungBtn.classList.add('selected');
      themePreteenBtn.classList.remove('selected');
      paneYoung.classList.add('active');
      panePreteen.classList.remove('active');
      resetBtn.textContent = '🔄 Reset Stars';
    } else {
      themePreteenBtn.classList.add('selected');
      themeYoungBtn.classList.remove('selected');
      panePreteen.classList.add('active');
      paneYoung.classList.remove('active');
      resetBtn.textContent = '📚 Tidy Books';
    }
  }

  themeYoungBtn.addEventListener('click', () => setTheme('young'));
  themePreteenBtn.addEventListener('click', () => setTheme('preteen'));

  // ---------- BOOKS SETUP ----------
  const booksContainer = document.getElementById('booksContainer');
  const bookColors = [
    {cover:'#ee5253', spine:'#c8d6e5'}, 
    {cover:'#0abde3', spine:'#ffffff'}, 
    {cover:'#10ac84', spine:'#feca57'}, 
    {cover:'#5f27cd', spine:'#ff9ff3'}, 
    {cover:'#ff9f43', spine:'#ffffff'},
    {cover:'#54a0ff', spine:'#feca57'}
  ];
  let books = [];
  const TOTAL_BOOKS = 6;

  function buildBooks(){
    booksContainer.innerHTML='';
    books=[];
    const startX = 25;
    const gap = 42;
    for(let i=0; i<TOTAL_BOOKS; i++){
      const c = bookColors[i % bookColors.length];
      const b = document.createElement('div');
      b.className = 'mcBook';
      const baseLeft = startX + (i * gap);
      b.style.left = baseLeft + 'px';
      
      b.innerHTML = `
        <svg class="bookClosed" viewBox="0 0 30 65">
          <rect x="0" y="0" width="26" height="65" fill="${c.cover}" rx="2"/>
          <rect x="26" y="0" width="4" height="65" fill="rgba(0,0,0,0.25)"/>
          <rect x="3" y="2" width="20" height="4" fill="${c.spine}"/>
          <rect x="3" y="59" width="20" height="4" fill="${c.spine}"/>
          <rect x="8" y="25" width="10" height="14" fill="#feca57" rx="1"/>
        </svg>

        <svg class="bookOpen" viewBox="0 0 65 50">
          <polygon points="32,10 5,15 5,45 32,40" fill="#ffffff"/>
          <polygon points="32,10 5,15 5,18 32,13" fill="#c8d6e5"/>
          <polygon points="32,10 60,15 60,45 32,40" fill="#f5f6fa"/>
          <polygon points="32,10 60,15 60,18 32,13" fill="#dcdde1"/>
          <polygon points="32,7 2,13 2,47 32,42" fill="${c.cover}" opacity="0.8"/>
          <polygon points="32,7 63,13 63,47 32,42" fill="${c.cover}" opacity="0.8"/>
          <line x1="10" y1="22" x2="26" y2="20" stroke="#718093" stroke-width="2"/>
          <line x1="10" y1="28" x2="26" y2="26" stroke="#718093" stroke-width="2"/>
          <line x1="38" y1="20" x2="54" y2="22" stroke="#718093" stroke-width="2"/>
          <line x1="38" y1="26" x2="54" y2="28" stroke="#718093" stroke-width="2"/>
        </svg>
      `;

      booksContainer.appendChild(b);
      books.push({ el: b, baseLeft: baseLeft, currentShift: 0, fallen: false });
    }
  }
  buildBooks();

  const alertMsg = document.getElementById('alertMsg');
  const zzzAnim = document.getElementById('zzzAnim');
  const smokeFX = document.getElementById('smokeFX');
  const fireFX = document.getElementById('fireFX');

  const momEyeClosed = document.getElementById('momEyeClosed');
  const momEyeMedium = document.getElementById('momEyeMedium');
  const momEyeAngry = document.getElementById('momEyeAngry');
  const momMouthClosed = document.getElementById('momMouthClosed');
  const momMouthOpen = document.getElementById('momMouthOpen');

  const babyEyeClosed = document.getElementById('babyEyeClosed');
  const babyCryingFace = document.getElementById('babyCryingFace');

  resetBtn.onclick = ()=>{
    if(currentTheme==='preteen'){
      buildBooks();
      alertMsg.classList.remove('show');
      smokeFX.style.display = 'none';
      fireFX.style.display = 'none';
      zzzAnim.style.display = 'block';
      
      momEyeClosed.style.display = 'block';
      momEyeMedium.style.display = 'none';
      momEyeAngry.style.display = 'none';
      momMouthClosed.style.display = 'block';
      momMouthOpen.style.display = 'none';

      babyEyeClosed.style.display = 'block';
      babyCryingFace.style.display = 'none';
    } else {
      stars=0;
      starRow.textContent='⭐ 0';
      calmStreak=0;
    }
  };

  // SOUND EFFECTS GENERATOR
  let lastShhTime = 0;
  let lastRoarTime = 0;

  function playShhSound(){
    const now = Date.now();
    if(now - lastShhTime < 4000) return; // Pr
